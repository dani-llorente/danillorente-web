name: Deploy PRE (Plesk)
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Plesk deploy webhook
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            "${{ secrets.PLESK_WEBHOOK_URL }}" \
            -d '{"event":"push"}'
